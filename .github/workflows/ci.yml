name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit + parity tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: No secrets in the repository; service-role key only in server-only code
        run: pnpm check:secrets
      - name: One-time setup SQL matches the migrations
        run: pnpm db:setup-sql --check
      - run: pnpm typecheck
      - run: pnpm test
      # Builds without Supabase credentials on purpose: the app must build before it is configured.
      - run: pnpm build
      - name: Nothing secret in the browser bundle
        run: pnpm check:secrets --bundle

  integration:
    name: RLS + end-to-end against local Supabase
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (Docker)
        run: pnpm db:start
      - name: Schema matches supabase/schema-manifest.json
        run: pnpm db:manifest
      - name: Hosted-verification script (against the local stack)
        run: >-
          SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          node scripts/db/with-local-supabase.mjs sh -c
          'SUPABASE_URL=$TEST_SUPABASE_URL SUPABASE_ANON_KEY=$TEST_SUPABASE_ANON_KEY pnpm db:verify-hosted'
      - name: Database policy and audit tests
        run: pnpm test:db
      - name: Configure app for the local stack
        run: pnpm db:env
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Browser bundle does not contain the service-role key
        run: node scripts/db/with-local-supabase.mjs pnpm check:secrets --bundle
      - name: Start app
        run: |
          pnpm start > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/sign-in && break; sleep 1; done
      - name: End-to-end tests
        run: pnpm test:e2e
      - if: failure()
        run: tail -n 200 next.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - if: always()
        run: pnpm exec supabase stop --no-backup
